<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 30px;

    background: #111318;

}

.container {

h1 {

}

.subtitle {

.dashboard-top {

    top: 0;
    left: 0;
    width: 100%;

    z-index: 1000;
    background: #111318;
    padding: 30px max(30px, calc((100% - 1400px) / 2));
    padding-bottom: 1px;
    border-bottom: 1px solid #30343d;
}

.dashboard-top::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -10px;
    height: 10px;
    box-sizing: border-box;
    background: #111318;
    border-top: 1px solid #30343d;
}

.dashboard-section.active {
    padding-top: var(--dashboard-top-height, 196px);
}

.dashboard-nav {
    display: flex;
    gap: 8px;
    margin: 0 0 30px 0;
    padding: 5px;
    background: #181b21;
    border: 1px solid #2b2f38;
    border-radius: 10px;
    width: fit-content;
}

.nav-btn {
    border: 0;
    background: transparent;
    color: #9da4b0;
    padding: 9px 15px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.nav-btn:hover {
    background: #242831;
    color: #e8e8e8;
}

.nav-btn.active {
    background: #2a2f39;
    color: #f0f0f0;
}

.dashboard-section { display: none; }
.dashboard-section.active { display: block; }

.match {
    background: #1b1e24;
    border: 1px solid #30343d;
    border-radius: 10px;
    margin-bottom: 30px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
}

.match-header {
    padding: 20px;
    background: #232730;
    border-bottom: 1px solid #30343d;
}

.match-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
}

.match-info {
    color: #aaa;
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

.table-wrapper { overflow-x: auto; }

.ranking-table-wrapper {
    overflow: visible;
}

.ranking-match {
    overflow: visible;
}


@media (max-width: 600px) {
    .ranking-match {
        width: 100%;
        box-sizing: border-box;
        margin-left: 0;
        margin-right: 0;
    }

    .ranking-match .table-wrapper,
    .ranking-match .ranking-table-wrapper {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
    }

    .ranking-table {
        width: 900px;

        max-width: none;
        table-layout: fixed;
    }

    .ranking-table th,

        padding: 7px 8px;
        font-size: 12px;
        white-space: nowrap;
    }

    .ranking-table .weapons {
        white-space: normal;
        min-width: 180px;
        max-width: 280px;
    }

    .ranking-table .award-badge {
        display: inline-block;
        margin: 2px 3px 2px 0;
        vertical-align: middle;
    }

    .ranking-table thead th {
        top: 0;
    }
}

.ranking-table thead th {
    position: sticky;
    top: var(--dashboard-top-height, 300px);
    z-index: 50;
    background: #111318;
    box-shadow: 0 1px 0 #30343d;
}

/* The separate sticky ranking header is mobile-only.
   Desktop uses the original table header. */
.ranking-sticky-header {
    display: none;
}

@media (max-width: 600px) {
    .ranking-table {
        width: 900px;
        min-width: 900px;
        max-width: none;
        table-layout: fixed;
    }

    .ranking-table th,
    .ranking-table td {
        padding: 7px 8px;
        font-size: 12px;
        white-space: nowrap;
    }

    .ranking-table .weapons {
        white-space: normal;
        min-width: 180px;

    }

    .ranking-table .award-badge {
        display: inline-block;
        margin: 2px 3px 2px 0;
        vertical-align: middle;
    }

    /* iOS/Safari: use a separate sticky header because the

    .ranking-table-wrapper > .ranking-table thead {
        display: none;
    }

    .ranking-sticky-header {
        position: sticky;
        top: var(--dashboard-top-height, 196px);
        z-index: 60;
        width: 100%;
        overflow: hidden;
        background: #111318;
        box-shadow: 0 1px 0 #30343d;
    }

    .ranking-sticky-header {
        display: block;
    }

    .ranking-sticky-table {
        width: 900px;
        min-width: 900px;
        max-width: none;
        table-layout: fixed;
        margin: 0;
        transform: translateX(0);
        will-change: transform;
    }

    .ranking-sticky-table th {
        background: #111318;
        box-shadow: none;
    }

}

/* Desktop keeps the original sticky table header. */
.ranking-table-wrapper > .ranking-table thead th {
    position: sticky;
    top: var(--dashboard-top-height, 300px);
    z-index: 50;
    background: #111318;
    box-shadow: 0 1px 0 #30343d;
}

@media (max-width: 600px) {
    .ranking-table-wrapper > .ranking-table thead th {
        position: static;
        top: auto;
    }
}

/* Match tables fit the available width.

.match-table {
    width: 100%;
    min-width: 0;
    max-width: 100%;

}

/* Mobile: keep the table readable and allow horizontal scrolling. */
@media (max-width: 1200px) {

        width: 1150px;

        table-layout: fixed;
    }

    }
}

.match-table th,
.match-table td {
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Column headers must remain fully readable on narrow screens.

.match-table th {
    white-space: nowrap;
    overflow: visible;
    text-overflow: clip;
    overflow-wrap: normal;
    word-break: normal;
    line-height: 1.15;

}

.match-table .player {
    overflow: visible;

}

.match-table .weapons {
    white-space: normal;

}

.standard-match-table th:nth-child(1),

table-layout: fixed;}

<body>
<div class="container">
<div class="dashboard-top">

<div class="subtitle">CS2 LAN Statistics v0.8.159</div>
<nav class="dashboard-nav">
    <button class="nav-btn active" data-section="overview">Matches</button>
    <button class="nav-btn" data-section="ranking">Global Ranking</button>
    <button class="nav-btn" data-section="awards">Awards</button>
</nav>
</div>

</section>

<div class="ranking-sticky-header">
<table class="ranking-sticky-table">
<thead><tr>
    <th>#</th><th>Player</th><th>Score</th><th>Matches</th><th>Kills</th><th>Deaths</th>
    <th>Assists</th><th>K/D Ratio</th><th>Headshot %</th><th>Damage</th><th>Awards</th>
</tr></thead>
</table>
</div>
<div class="table-wrapper ranking-table-wrapper">
<table class="ranking-table">
<thead><tr>
    <th>#</th><th>Player</th><th>Score</th><th>Matches</th><th>Kills</th><th>Deaths</th>
    <th>Assists</th><th>K/D Ratio</th><th>Headshot %</th><th>Damage</th><th>Awards</th>
</tr></thead><tbody>
</tbody></table></div></div></section>
<section id="awards" class="dashboard-section">
<div class="match">
<div class="awards-grid">

</div></div></section>
    <script>
    const dashboardTop = document.querySelector('.dashboard-top');
    
    function updateDashboardTopHeight() {
    if (dashboardTop) {
    document.documentElement.style.setProperty(
    '--dashboard-top-height',
    `${dashboardTop.offsetHeight}px`
    );
    }
    }
    
    updateDashboardTopHeight();
    
    if (dashboardTop && 'ResizeObserver' in window) {
    new ResizeObserver(updateDashboardTopHeight).observe(dashboardTop);
    }
    
    document.querySelectorAll('a.award-badge').forEach(link => {
        link.addEventListener('click', event => {
            const targetId = link.getAttribute('href');
            if (!targetId || !targetId.startsWith('#award-')) return;

            event.preventDefault();

            const awardsButton = document.querySelector('.nav-btn[data-section="awards"]');
            const awardsSection = document.getElementById('awards');

            document.querySelectorAll('.nav-btn')
                .forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.dashboard-section')
                .forEach(s => s.classList.remove('active'));

            if (awardsButton) awardsButton.classList.add('active');
            if (awardsSection) awardsSection.classList.add('active');

            const scrollToAward = () => {
                const target = document.querySelector(targetId);
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                    return true;
                }
                return false;
            };

            if (!scrollToAward()) {
                setTimeout(() => {
                    scrollToAward();
                }, 100);
            }
        });
    });

    const rankingScroll = document.querySelector('.ranking-table-wrapper');
    const rankingStickyTable = document.querySelector('.ranking-sticky-table');

    function syncRankingStickyHeader() {
    if (!rankingScroll || !rankingStickyTable) return;

    rankingStickyTable.style.transform =
    `translateX(${-rankingScroll.scrollLeft}px)`;
    }

    if (rankingScroll) {
    rankingScroll.addEventListener(
    'scroll',
    syncRankingStickyHeader,
    { passive: true }
    );
    syncRankingStickyHeader();
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
    window.scrollTo(0, 0);
    document.querySelectorAll('.nav-btn')
    .forEach(b => b.classList.remove('active'));
    
    document.querySelectorAll('.dashboard-section')
    .forEach(s => s.classList.remove('active'));
    
    btn.classList.add('active');
    document.getElementById(btn.dataset.section)
    .classList.add('active');

    if (btn.dataset.section === 'ranking') {
    if (rankingScroll) rankingScroll.scrollLeft = 0;
    syncRankingStickyHeader();
    }
    });
    });
    </script>
</div></body></html>
