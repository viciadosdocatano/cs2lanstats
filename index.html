<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viciados do Catano - CS2 LANStats</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, Helvetica, sans-serif;
    background: #111318;
    color: #e8e8e8;
}

.container {
    max-width: 1400px;
    margin: auto;
}

h1 {
    margin: 0 0 5px 0;
    font-size: 32px;
}

.subtitle {
    color: #aeb5c0;
    margin-bottom: 30px;
    font-size: 14px;
    font-weight: 500;
}

.dashboard-top {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    box-sizing: border-box;
    z-index: 1000;
    background: #111318;
    padding: 30px max(30px, calc((100% - 1400px) / 2));
    padding-bottom: 1px;
    border-bottom: 1px solid #30343d;
}

.dashboard-top::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -10px;
    height: 10px;
    box-sizing: border-box;
    background: #111318;
    border-top: 1px solid #30343d;
}

.dashboard-section.active {
    padding-top: var(--dashboard-top-height, 196px);
}

.dashboard-nav {
    display: flex;
    gap: 8px;
    margin: 0 0 30px 0;
    padding: 5px;
    background: #181b21;
    border: 1px solid #2b2f38;
    border-radius: 10px;
    width: fit-content;
}

.nav-btn {
    border: 0;
    background: transparent;
    color: #9da4b0;
    padding: 9px 15px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.nav-btn:hover {
    background: #242831;
    color: #e8e8e8;
}

.nav-btn.active {
    background: #2a2f39;
    color: #f0f0f0;
}

.dashboard-section { display: none; }
.dashboard-section.active { display: block; }

.match {
    background: #1b1e24;
    border: 1px solid #30343d;
    border-radius: 10px;
    margin-bottom: 30px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
}

.match-header {
    padding: 20px;
    background: #232730;
    border-bottom: 1px solid #30343d;
}

.match-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
}

.match-info {
    color: #aaa;
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

.table-wrapper { overflow-x: auto; }

.ranking-table-wrapper {
    overflow: visible;
}

.ranking-match {
    overflow: visible;
}


@media (max-width: 600px) {
    .ranking-match {
        width: 100%;
        box-sizing: border-box;
        margin-left: 0;
        margin-right: 0;
    }

    .ranking-match .table-wrapper,
    .ranking-match .ranking-table-wrapper {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
    }

    .ranking-table {
        width: 900px;
        min-width: 900px;
        max-width: none;
        table-layout: fixed;
    }

    .ranking-table th,
    .ranking-table td {
        padding: 7px 8px;
        font-size: 12px;
        white-space: nowrap;
    }

    .ranking-table .weapons {
        white-space: normal;
        min-width: 180px;
        max-width: 280px;
    }

    .ranking-table .award-badge {
        display: inline-block;
        margin: 2px 3px 2px 0;
        vertical-align: middle;
    }

    .ranking-table thead th {
        top: 0;
    }
}

.ranking-table thead th {
    position: sticky;
    top: var(--dashboard-top-height, 300px);
    z-index: 50;
    background: #111318;
    box-shadow: 0 1px 0 #30343d;
}

/* The separate sticky ranking header is mobile-only.
   Desktop uses the original table header. */
.ranking-sticky-header {
    display: none;
}

@media (max-width: 600px) {
    .ranking-table {
        width: 900px;
        min-width: 900px;
        max-width: none;
        table-layout: fixed;
    }

    .ranking-table th,
    .ranking-table td {
        padding: 7px 8px;
        font-size: 12px;
        white-space: nowrap;
    }

    .ranking-table .weapons {
        white-space: normal;
        min-width: 180px;
        max-width: 280px;
    }

    .ranking-table .award-badge {
        display: inline-block;
        margin: 2px 3px 2px 0;
        vertical-align: middle;
    }

    /* iOS/Safari: use a separate sticky header because the
       real table is inside the horizontal scroll container. */
    .ranking-table-wrapper > .ranking-table thead {
        display: none;
    }

    .ranking-sticky-header {
        position: sticky;
        top: var(--dashboard-top-height, 196px);
        z-index: 60;
        width: 100%;
        overflow: hidden;
        background: #111318;
        box-shadow: 0 1px 0 #30343d;
    }

    .ranking-sticky-header {
        display: block;
    }

    .ranking-sticky-table {
        width: 900px;
        min-width: 900px;
        max-width: none;
        table-layout: fixed;
        margin: 0;
        transform: translateX(0);
        will-change: transform;
    }

    .ranking-sticky-table th {
        background: #111318;
        box-shadow: none;
    }

    .ranking-table th:nth-child(1),
    .ranking-sticky-table th:nth-child(1) { width: 4%; }

    .ranking-table th:nth-child(2),
    .ranking-sticky-table th:nth-child(2) { width: 18%; }

    .ranking-table th:nth-child(3),
    .ranking-sticky-table th:nth-child(3) { width: 7%; }

    .ranking-table th:nth-child(4),
    .ranking-sticky-table th:nth-child(4) { width: 7%; }

    .ranking-table th:nth-child(5),
    .ranking-sticky-table th:nth-child(5) { width: 8%; }

    .ranking-table th:nth-child(6),
    .ranking-sticky-table th:nth-child(6) { width: 11%; }

    .ranking-table th:nth-child(7),
    .ranking-sticky-table th:nth-child(7) { width: 10%; }

    .ranking-table th:nth-child(8),
    .ranking-sticky-table th:nth-child(8) { width: 11%; }

    .ranking-table th:nth-child(9),
    .ranking-sticky-table th:nth-child(9) { width: 8%; }

    .ranking-table th:nth-child(10),
    .ranking-sticky-table th:nth-child(10) { width: 16%; }
}

/* Desktop keeps the original sticky table header. */
.ranking-table-wrapper > .ranking-table thead th {
    position: sticky;
    top: var(--dashboard-top-height, 300px);
    z-index: 50;
    background: #111318;
    box-shadow: 0 1px 0 #30343d;
}

@media (max-width: 600px) {
    .ranking-table-wrapper > .ranking-table thead th {
        position: static;
        top: auto;
    }
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;

table-layout: fixed;}
th { text-align: left; }

table th:nth-child(1), table td:nth-child(1) { width: 4%; }
table th:nth-child(2), table td:nth-child(2) { width: 18%; }
table th:nth-child(3), table td:nth-child(3) { width: 7%; }
table th:nth-child(4), table td:nth-child(4) { width: 7%; }
table th:nth-child(5), table td:nth-child(5) { width: 8%; }
table th:nth-child(6), table td:nth-child(6) { width: 11%; }
table th:nth-child(7), table td:nth-child(7) { width: 10%; }
table th:nth-child(8), table td:nth-child(8) { width: 11%; }
table th:nth-child(9), table td:nth-child(9) { width: 8%; }
table th:nth-child(10), table td:nth-child(10) { width: 16%; }

th {
    background: #15171c;
    color: #aaa;
    font-size: 12px;
    text-transform: uppercase;
    padding: 12px 10px;
    white-space: nowrap;
}

th:first-child, th:nth-child(2), th:last-child { text-align: left; }

td {
    padding: 11px 10px;
    border-top: 1px solid #2a2d34;
    }

td:first-child,
td:nth-child(2) { text-align: left; }

tr:hover { background: #252932; }

/* Team indicator for Casual / Competitive match tables. */
.team-ct td:first-child { border-left: 4px solid #4f8cff; }
.team-t td:first-child { border-left: 4px solid #d6b35b; }
.team-separator td { border-top: 2px solid #3a3e47; }

.player,
.ranking-player {
    font-weight: bold;
}

.bot,
.human {
    font-size: 11px;
    margin-left: 6px;
}

.bot { color: #aaa; }
.human { color: #d8d8d8; }

.positive { color: #75d68a; }
.negative { color: #e67d7d; }

.weapons {
    color: #aaa;
    font-size: 12px;
    text-align: left !important;
    max-width: 350px;
}

.empty {
    padding: 40px;
    text-align: center;
    color: #777;
}

.muted { color: #777; }

.award-badge {
    display: inline-block;
    margin: 2px 3px 2px 0;
    padding: 4px 7px;
    border: 1px solid #3a404b;
    border-radius: 6px;
    background: #252a33;
    color: #d9dde4;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
}

.awards-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px;
}

.award-mvp-row {
    display: flex;
    justify-content: center;
    width: 100%;
}

.award-secondary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 400px));
    justify-content: center;
    gap: 24px;
    width: 100%;
}

.award-card {
    width: min(100%, 400px);
    overflow: hidden;
    background: transparent;
    text-align: center;
}

.award-card-inner {
    position: relative;
    margin: 0;
    overflow: hidden;
}

.award-art {
    position: relative;
    width: 100%;
    height: auto;
    overflow: hidden;
}

.award-art-image {
    display: block;
    width: 100%;
    height: auto;
}

.award-player {
    position: absolute;
    color: #58247e;
    left: 18%;
    right: 18%;
    top: 71.8%;
    transform: translateY(-50%);
    color: #8f3db5;
    font-size: clamp(14px, 5vw, 25px);
    font-weight: 900;
    letter-spacing: 1.5px;
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 4px rgba(0,0,0,.8);
}

/* All award artwork uses the same three-column stat layout. */
.award-stat-value {
    position: absolute;
    top: 75%;
    transform: translate(-50%, -50%);
    width: 23%;
    text-align: center;
    color: #f2eee5;
    font-size: clamp(15px, 3.9vw, 23px);
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,.85);
}

.award-mvp-player,
.award-headhunter-player,
.award-lowrider-player,
.award-thebutcher-player {
    top: 84.3%;
}

/* Stat columns are aligned to the three fields in every card. */
.award-mvp-stat-kills,
.award-stat-headshots,
.award-lowrider-stat-time,
.award-thebutcher-stat-kills,
.award-camper-stat-time { left: 20%; }

.award-mvp-stat-deaths,
.award-stat-hspercent,
.award-lowrider-stat-count,
.award-thebutcher-stat-hits,
.award-camper-stat-longest { left: 50%; }

.award-mvp-stat-kd,
.award-stat-totalkills,
.award-lowrider-stat-percent,
.award-thebutcher-stat-damage,
.award-camper-stat-kills { left: 80%; }

.award-stat-value.stat-long {
    font-size: clamp(14px, 3.5vw, 21px);
}

.award-stat-value.stat-extra-long {
    font-size: clamp(13px, 3vw, 18px);
}

/* The Camper player name sits slightly higher in its artwork. */
.award-camper-player {
    top: 84.3%;
    left: 20%;
    right: 20%;
}

.award-camper-stat {
    color: #f2eee5;
}

.award-thebutcher-stat {
    color: #f2eee5;
}

.award-missing-image {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 2 / 3;
    padding: 30px;
    border: 2px solid #a87820;
    color: #d6b35b;
    background: #0d0e10;
    font-weight: 700;
    text-align: center;
}

@media (max-width: 700px) {
    body { padding: 10px; }
    .match-info {
        gap: 10px;
        flex-direction: column;
    }
    .dashboard-nav {
        width: 100%;
        overflow-x: auto;
    }
    .nav-btn { white-space: nowrap; }
}
</style>
</head>
<body>
<div class="container">
<div class="dashboard-top">
<h1>Viciados do Catano</h1>
<div class="subtitle">CS2 LAN Statistics v0.8.96</div>
<nav class="dashboard-nav">
    <button class="nav-btn active" data-section="overview">Overview</button>
    <button class="nav-btn" data-section="ranking">Global Ranking</button>
    <button class="nav-btn" data-section="awards">Awards</button>
</nav>
</div>
<section id="overview" class="dashboard-section active">
<div class="match"><div class="empty">No matches recorded yet.</div></div>
</section>
<section id="ranking" class="dashboard-section">
<div class="match ranking-match">
<div class="match-header">
    <div class="match-title">Global Ranking</div>
    <div class="match-info"><span>All recorded matches</span></div>
</div>
<div class="ranking-sticky-header">
<table class="ranking-sticky-table">
<thead><tr>
    <th>#</th><th>Player</th><th>Matches</th><th>Kills</th><th>Deaths</th>
    <th>Assists</th><th>K/D Ratio</th><th>Headshot %</th><th>Damage</th><th>Awards</th>
</tr></thead>
</table>
</div>
<div class="table-wrapper ranking-table-wrapper">
<table class="ranking-table">
<thead><tr>
    <th>#</th><th>Player</th><th>Matches</th><th>Kills</th><th>Deaths</th>
    <th>Assists</th><th>K/D Ratio</th><th>Headshot %</th><th>Damage</th><th>Awards</th>
</tr></thead><tbody>
</tbody></table></div></div></section>
<section id="awards" class="dashboard-section">
<div class="match">
<div class="match-header">
    <div class="match-title">Awards</div>
    <div class="match-info">
        <span>Viciados do Catano · all recorded matches</span>
    </div>
</div>
<div class="awards-grid">

</div></div></section>
    <script>
    const dashboardTop = document.querySelector('.dashboard-top');
    
    function updateDashboardTopHeight() {
    if (dashboardTop) {
    document.documentElement.style.setProperty(
    '--dashboard-top-height',
    `${dashboardTop.offsetHeight}px`
    );
    }
    }
    
    updateDashboardTopHeight();
    
    if (dashboardTop && 'ResizeObserver' in window) {
    new ResizeObserver(updateDashboardTopHeight).observe(dashboardTop);
    }
    
    const rankingScroll = document.querySelector('.ranking-table-wrapper');
    const rankingStickyTable = document.querySelector('.ranking-sticky-table');

    function syncRankingStickyHeader() {
    if (!rankingScroll || !rankingStickyTable) return;

    rankingStickyTable.style.transform =
    `translateX(${-rankingScroll.scrollLeft}px)`;
    }

    if (rankingScroll) {
    rankingScroll.addEventListener(
    'scroll',
    syncRankingStickyHeader,
    { passive: true }
    );
    syncRankingStickyHeader();
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
    window.scrollTo(0, 0);
    document.querySelectorAll('.nav-btn')
    .forEach(b => b.classList.remove('active'));
    
    document.querySelectorAll('.dashboard-section')
    .forEach(s => s.classList.remove('active'));
    
    btn.classList.add('active');
    document.getElementById(btn.dataset.section)
    .classList.add('active');

    if (btn.dataset.section === 'ranking') {
    if (rankingScroll) rankingScroll.scrollLeft = 0;
    syncRankingStickyHeader();
    }
    });
    });
    </script>
</div></body></html>
